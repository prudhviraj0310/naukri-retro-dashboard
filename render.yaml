# render.yaml — Render Blueprint for CareerFlow AI Dashboard
# Deploy with: https://render.com/deploy?repo=<your-github-repo-url>

services:
  - type: web
    name: careerflow-ai-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: "3.11.12"
      - key: USERNAME
        sync: false           # Set manually in Render dashboard
      - key: PASSWORD
        sync: false           # Set manually in Render dashboard
      - key: OPENROUTER_API_KEY
        sync: false           # Set manually in Render dashboard
      - key: DATABASE_URL
        sync: false           # Set manually in Render dashboard to Neon database URL
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: careerflow-ai-dashboard
          property: host
    healthCheckPath: /api/status
